name: 🤖 Auto Blog Post Diario

on:
  schedule:
    - cron: '0 13 * * *'  # Todos los días a las 9:00 AM (hora de República Dominicana / EST)
  workflow_dispatch:       # También se puede ejecutar manualmente desde GitHub

jobs:
  auto-post:
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Generar y publicar artículo con Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_POST_SECRET: ${{ secrets.AUTO_POST_SECRET }}
        run: |
          node -e "
          const https = require('https');

          // Lista de temas para rotar cada día
          const topics = [
            'consejos para programar mejor en Android con Kotlin',
            'novedades de inteligencia artificial para desarrolladores en 2025',
            'cómo optimizar el rendimiento de apps Android',
            'herramientas gratuitas imprescindibles para desarrolladores web',
            'cómo crear una API REST con Node.js paso a paso',
            'mejores prácticas de seguridad en aplicaciones móviles',
            'cómo publicar tu app en Google Play Store correctamente',
            'diferencias entre React Native y Android nativo',
            'tips de UI/UX para apps Android profesionales',
            'cómo manejar bases de datos locales en Android con Room',
            'introducción a TypeScript para desarrolladores JavaScript',
            'cómo usar Git y GitHub en proyectos de desarrollo',
            'qué es el Clean Code y por qué debes aplicarlo',
            'cómo mejorar la velocidad de carga de tu sitio web',
            'introducción al desarrollo con Next.js para principiantes',
          ];

          const today = new Date().getDay();
          const topic = topics[Math.floor(Math.random() * topics.length)];

          console.log('Tema de hoy:', topic);

          const prompt = 'Escribe un artículo de blog completo en español sobre: ' + topic + '. ' +
            'El artículo debe ser útil, educativo y tener entre 500 y 700 palabras. ' +
            'Responde ÚNICAMENTE con un objeto JSON válido, sin bloques markdown. ' +
            'Usa exactamente esta estructura: ' +
            '{\"title\": \"título atractivo aquí\", \"excerpt\": \"resumen breve de 1 a 2 oraciones\", ' +
            '\"content\": \"contenido completo en formato Markdown con subtítulos ## y párrafos\", ' +
            '\"tag\": \"una de estas exactamente: Android, Tutorial, Tecnología, Programación, Web\", ' +
            '\"readTime\": \"X min de lectura\", ' +
            '\"imagePrompt\": \"short English description of the futuristic device or AI concept for this topic\"}';

          const geminiBody = JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              temperature: 0.7,
              maxOutputTokens: 3000,
              responseMimeType: 'application/json'
            }
          });

          const geminiReq = https.request({
            hostname: 'generativelanguage.googleapis.com',
            path: '/v1beta/models/gemini-3.6-flash:generateContent?key=' + process.env.GEMINI_API_KEY,
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(geminiBody)
            }
          }, (res) => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', async () => {
              try {
                const geminiRes = JSON.parse(data);

                if (geminiRes.error) {
                  console.error('❌ Error devuelto por Gemini API:', JSON.stringify(geminiRes.error, null, 2));
                  process.exit(1);
                }

                if (!geminiRes.candidates || !geminiRes.candidates[0]) {
                  console.error('❌ Error: Gemini no devolvió candidatos. Respuesta:', data);
                  process.exit(1);
                }

                let text = geminiRes.candidates[0].content.parts[0].text.trim();

                // Quitar bloques markdown si los hay
                text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

                // Asegurar que tomamos el objeto JSON limpio entre { y }
                const firstBrace = text.indexOf('{');
                const lastBrace = text.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace !== -1) {
                  text = text.substring(firstBrace, lastBrace + 1);
                }

                const blogData = JSON.parse(text);
                console.log('✅ Contenido generado:', blogData.title);

                // Generar ilustración futurista limpia sin marcas de agua ni texto
                const techPrompt = (blogData.imagePrompt || blogData.title) + 
                  ', futuristic smartphone floating in dark space, vibrant neon cyan and electric blue glowing AI neural network and circuits, dark clean cyberpunk background, 8k render, octane unreal engine 5 style, clean 3d render, completely clean, no text, no letters, no words, no watermark, no logos, no typography, no banner, no stock photo watermark, pure digital art';

                console.log('🎨 Generando ilustración limpia con IA (Flux)...');
                const imgUrl = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(techPrompt) + '?width=800&height=450&nologo=true&model=flux';

                let coverImage = '🤖';
                try {
                  coverImage = await new Promise((resolve) => {
                    https.get(imgUrl, (imgRes) => {
                      if (imgRes.statusCode !== 200) {
                        console.warn('⚠️ No se pudo generar la imagen (status ' + imgRes.statusCode + '), usando emoji');
                        return resolve('🤖');
                      }
                      const chunks = [];
                      imgRes.on('data', c => chunks.push(c));
                      imgRes.on('end', () => {
                        const buf = Buffer.concat(chunks);
                        console.log('🖼️ Ilustración descargada con éxito (' + (buf.length / 1024).toFixed(1) + ' KB)');
                        resolve('data:image/jpeg;base64,' + buf.toString('base64'));
                      });
                    }).on('error', (err) => {
                      console.warn('⚠️ Error de red al descargar imagen:', err.message);
                      resolve('🤖');
                    });
                  });
                } catch (imgErr) {
                  console.warn('⚠️ Error al procesar imagen:', imgErr.message);
                }

                blogData.emoji = coverImage;

                console.log('🚀 Publicando artículo en munecotecnology.uk...');
                const postBody = JSON.stringify(blogData);

                const postReq = https.request({
                  hostname: 'munecotecnology.uk',
                  path: '/api/auto-post',
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + process.env.AUTO_POST_SECRET,
                    'Content-Length': Buffer.byteLength(postBody)
                  }
                }, (postRes) => {
                  let postData = '';
                  postRes.on('data', chunk => postData += chunk);
                  postRes.on('end', () => {
                    if (postRes.statusCode === 201) {
                      console.log('✅ ¡Artículo con ilustración publicado exitosamente! ID:', JSON.parse(postData).postId);
                    } else {
                      console.error('❌ Error al publicar. Status:', postRes.statusCode, 'Respuesta:', postData);
                      process.exit(1);
                    }
                  });
                });

                postReq.on('error', (e) => { console.error('Error de red al publicar:', e); process.exit(1); });
                postReq.write(postBody);
                postReq.end();

              } catch(e) {
                console.error('Error procesando respuesta de Gemini:', e.message);
                if (typeof text !== 'undefined') console.error('Texto recibido que falló:', text);
                process.exit(1);
              }
            });
          });

          geminiReq.on('error', (e) => { console.error('Error llamando a Gemini:', e); process.exit(1); });
          geminiReq.write(geminiBody);
          geminiReq.end();
          "
